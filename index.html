
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit Converter - by Usman </title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Metric/imperial Unit Converter</h1>
        <input type="text" id="input-el" placeholder="0">
        <button id="convert-btn">Convert</button>
    </div>
    <div class="result">
        <div class="slot1">
            <h3>Lenght (meter/feet)</h3>
            <p  id="length-el"></p>
         </div>
        <div class="slot2">
            <h3>Volume (liter/gallon)</h3>
            <p id="volume-el"></p>
        </div>
        <div class="slot3">
            <h3>Mass (kilogram/pound)</h3>
            <p id="mass-el"></p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
